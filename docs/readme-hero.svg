    <text x="80" y="326" fill="#A7A99F" font-size="19">Bir renk seç. Uyumlu paletini oluştur.</text>
    <text x="80" y="355" fill="#A7A99F" font-size="19">Renklerini düzenle, kaydet ve tasarımında kullan.</text>
