<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Colorvia — Renk Stüdyosu</title>
  <desc id="desc">Colorvia'nın yerel çalışan renk paleti stüdyosunu ve beş renkli palet önizlemesini gösteren kapak görseli.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="28" x2="1380" y2="540" gradientUnits="userSpaceOnUse"><stop stop-color="#191B17"/><stop offset="1" stop-color="#10110F"/></linearGradient>
    <linearGradient id="glow" x1="790" y1="45" x2="1300" y2="485" gradientUnits="userSpaceOnUse"><stop stop-color="#C9ED61" stop-opacity=".18"/><stop offset="1" stop-color="#C9ED61" stop-opacity="0"/></linearGradient>
    <linearGradient id="spectrum" x1="870" y1="412" x2="1320" y2="412" gradientUnits="userSpaceOnUse"><stop stop-color="#C9ED61"/><stop offset=".28" stop-color="#93B987"/><stop offset=".55" stop-color="#4F7970"/><stop offset=".78" stop-color="#456A77"/><stop offset="1" stop-color="#C7B78C"/></linearGradient>
    <filter id="shadow" x="770" y="104" width="616" height="390" color-interpolation-filters="sRGB" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
